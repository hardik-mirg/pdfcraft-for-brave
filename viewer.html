<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PdfCraft</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="viewer.js"></script>
</head>
<body class="viewer">
  <header class="bar">
    <strong>PdfCraft</strong>
    <span id="status" role="status">Opening PDF…</span>
    <button id="download-original" hidden>Download original</button>
    <button id="use-brave" disabled>Open in Brave’s viewer</button>
  </header>
  <main>
    <canvas id="pdfcraft" data-host="page" aria-label="PdfCraft document viewer"></canvas>
  </main>
  <dialog id="discard">
    <p id="reload-note" hidden>Brave may request this PDF again. A single-use link or a PDF generated by a form may no longer open.</p>
    <p id="discard-note" hidden>Switching viewers closes this PdfCraft session. Any changes that haven’t been saved to disk will be lost.</p>
    <form method="dialog">
      <button value="cancel" autofocus>Stay in PdfCraft</button>
      <button value="switch">Switch to Brave’s viewer</button>
    </form>
  </dialog>
</body>
</html>
